name: Auto-close (project frozen)

# The upstream eufy-security-client library has been deprecated by its maintainer.
# Eufy has migrated its apps to a new "Mega" protocol, and a new SDK was built
# against it. The v5 rewrite on top of that SDK is in progress (tracked in #981),
# so v4 is frozen: no new features or device support, and most breakages
# originate upstream.
#
# This workflow posts an explanation on every newly opened issue and pull request
# and closes it immediately.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: auto-close-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const node = isPR ? context.payload.pull_request : context.payload.issue;
            const number = node.number;

            // Never auto-close items opened by the maintainers/team, nor anything
            // explicitly flagged to stay open. This lets us keep working in the repo
            // while the project is frozen for outside contributors.
            const association = node.author_association;
            const exemptAssociations = ["OWNER", "MEMBER", "COLLABORATOR"];
            const labels = (node.labels || []).map((l) => (typeof l === "string" ? l : l.name));
            if (exemptAssociations.includes(association) || labels.includes("keep-open")) {
              core.info(`Skipping auto-close for #${number} (association=${association}, labels=${labels.join(",")})`);
              return;
            }

            const intro = isPR
              ? "Thank you for the pull request."
              : "Thank you for taking the time to open this issue.";

            const body = [
              intro,
              "",
              "**This project is currently frozen.**",
              "",
              "The plugin relies on [`eufy-security-client`](https://github.com/bropat/eufy-security-client), which its maintainer has **deprecated**. Eufy has moved its apps to a new **\"Mega\"** protocol, and a new SDK has been built against it. All development effort is going into the v5 rewrite on top of that SDK.",
              "",
              "What this means for now:",
              "- ✅ The current version keeps working as-is for devices still on the old protocol.",
              "- 🧊 No new features or new device support can be added to v4.",
              "- 🩹 Only strictly necessary fixes for critical breakages will be considered.",
              "- 🚀 **Work on the v5 rewrite has started**, on top of the new Mega-protocol SDK.",
              "",
              "**Follow progress:** [#981 — Homebridge Eufy V5 migration](https://github.com/homebridge-plugins/homebridge-eufy/issues/981). No ETA: v5 ships when it is ready.",
              "",
              "Because of this, we are automatically closing new issues and pull requests until the v5 migration is complete. This is not a reflection on your report — we simply cannot action it right now.",
              "",
              "Please subscribe to [#981](https://github.com/homebridge-plugins/homebridge-eufy/issues/981) for updates.",
              "",
              "💬 For questions and discussion, join us on [Discord](https://discord.gg/jc8FSjqQAN).",
              "",
              "Thank you for your patience. 🙏",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });

            if (isPR) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                state: "closed",
              });
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                state: "closed",
                state_reason: "not_planned",
              });
            }
