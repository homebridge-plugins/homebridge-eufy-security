name: CI

on:
  push:
    branches:
      - beta-5.0.0
  pull_request:
    branches:
      - beta-5.0.0

permissions:
  contents: read

# A force-push to a pull request supersedes the run already in flight, and only the newest head is a
# result anyone acts on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure GitHub Packages
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '\n@mega-yfue:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\n' >> "$npmrc"

      # The SDK is a private package, and a pull request from a fork is not given repository secrets. The
      # install would then fail as ENEEDAUTH several lines into npm's output, which reads as a broken
      # workflow rather than as the one thing it is. This names it instead.
      - name: Ensure the SDK registry can be read
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::No GitHub Packages token in scope, so @mega-yfue/eufy-sdk cannot be installed. A pull request from a fork cannot run this gate until the SDK is published publicly; push the branch to this repository instead."
            exit 1
          fi

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: npm ci --ignore-scripts

      # `--ignore-scripts` above is what keeps an arbitrary dependency from running code on this runner, but
      # `ffmpeg-for-homebridge` carries no binary in its tarball: its install script downloads the one the
      # plugin ships and hands to every media session. Without this the gate runs against a path that names a
      # file which is not there, so the one suite that reads a real banner off the shipped binary cannot.
      - name: Fetch the bundled FFmpeg binary
        run: npm rebuild ffmpeg-for-homebridge

      - name: Verify
        run: npm run verify
