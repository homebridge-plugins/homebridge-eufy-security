<link rel="stylesheet" href="app.css" />

<main class="shell" data-ui-shell>
  <header class="masthead" data-masthead>
    <span class="eufy-logo" aria-hidden="true">
      <img class="logo-light" src="assets/logo.svg" alt="" />
      <img class="logo-dark" src="assets/logo-dark.svg" alt="" />
    </span>
    <div>
      <p class="eyebrow" data-i18n="brand"></p>
      <h1 data-i18n="pageTitle" data-page-title></h1>
    </div>
  </header>

  <aside class="legacy-notice" data-legacy-notice hidden aria-labelledby="legacy-notice-title">
    <img class="notice-icon" src="assets/icons/warning.svg" alt="" />
    <div>
      <p class="eyebrow" data-i18n="legacyEyebrow"></p>
      <h2 id="legacy-notice-title" data-i18n="legacyTitle"></h2>
      <p data-i18n="legacySummary"></p>
      <p class="legacy-settings" data-legacy-settings></p>
    </div>
    <button type="button" data-legacy-acknowledge data-i18n="acknowledge"></button>
  </aside>

  <aside class="first-setup" data-first-setup hidden aria-labelledby="first-setup-title">
    <p class="eyebrow" data-i18n="firstSetupEyebrow"></p>
    <h2 id="first-setup-title" data-i18n="firstSetupTitle"></h2>
    <p data-i18n="firstSetupIntro"></p>
    <p class="first-setup-reason">
      <strong data-i18n="firstSetupReasonLabel"></strong>
      <span data-i18n="firstSetupReasonBody"></span>
    </p>
    <a
      href="https://support.eufylife.com/s/article/Share-Your-eufySecurity-Devices-With-Your-Family"
      target="_blank"
      rel="noopener noreferrer"
      data-i18n="shareLink"
    ></a>
    <div class="first-setup-confirmation">
      <label>
        <input type="checkbox" data-first-setup-ack />
        <span data-i18n="firstSetupAcknowledgement"></span>
      </label>
      <button type="button" data-first-setup-continue disabled data-i18n="firstSetupContinue"></button>
    </div>
  </aside>

  <section class="dashboard" data-dashboard hidden aria-labelledby="dashboard-title">
    <div class="dashboard-status" data-dashboard-state>
      <img class="status-icon" src="assets/icons/inventory.svg" alt="" />
      <div>
        <p class="eyebrow" data-i18n="devicesEyebrow"></p>
        <h2 id="dashboard-title" data-dashboard-title></h2>
      </div>
      <span class="status" data-dashboard-badge></span>
      <button type="button" class="dashboard-authenticate" data-dashboard-authenticate hidden data-i18n="authenticate"></button>
    </div>
    <p class="summary" data-dashboard-summary></p>
    <div data-device-groups></div>
    <p class="restart-guidance" data-restart-guidance hidden>
      <img src="assets/icons/refresh.svg" alt="" />
      <span data-i18n="restartGuidance"></span>
    </p>
  </section>

  <section
    class="panel"
    aria-labelledby="authentication-status"
    data-authentication="ready"
    data-setup-content
    hidden
  >
    <div class="status-row">
      <div>
        <p class="eyebrow" data-i18n="setupStatusEyebrow"></p>
        <h2 id="authentication-status" data-i18n="authReady"></h2>
      </div>
      <span class="status" data-i18n="available"></span>
    </div>

    <p class="summary" data-i18n="authSummary"></p>

    <div
      class="handoff"
      role="note"
      aria-label=""
      data-i18n-aria-label="accountConnectionLabel"
    >
      <strong data-i18n="oneAccountSession"></strong>
      <p data-i18n="sessionDetails"></p>
    </div>

    <ol class="steps" aria-label="" data-i18n-aria-label="setupSequenceLabel">
      <li class="current" aria-current="step">
        <span>1</span><strong data-i18n="stepAuthenticate"></strong>
      </li>
      <li><span>2</span><strong data-i18n="stepDiscover"></strong></li>
      <li><span>3</span><strong data-i18n="stepDevices"></strong></li>
    </ol>

    <form class="authentication-form" data-auth-form>
      <label>
        <span data-i18n="accountLabel"></span>
        <input type="email" autocomplete="username" required data-account />
      </label>
      <label>
        <span data-i18n="passwordLabel"></span>
        <input type="password" autocomplete="current-password" required data-password />
      </label>
      <div class="field-row">
        <label>
          <span data-i18n="countryLabel"></span>
          <input type="text" inputmode="text" maxlength="2" required data-country />
        </label>
        <label>
          <span data-i18n="trustedDeviceLabel"></span>
          <input type="text" maxlength="128" required data-trusted-device-name />
        </label>
      </div>
      <button type="submit" data-auth-submit data-i18n="authenticate"></button>
    </form>

    <form class="challenge-form" data-challenge-form hidden>
      <img class="captcha" alt="" data-challenge-image hidden />
      <label>
        <span data-challenge-label></span>
        <input type="text" inputmode="numeric" autocomplete="one-time-code" required data-challenge-answer />
      </label>
      <button type="submit" data-challenge-submit data-i18n="continueAuthentication"></button>
    </form>
    <p class="authentication-status" role="status" aria-live="polite" data-auth-status></p>
  </section>

  <p class="footnote" data-i18n="footnote"></p>
</main>

<script src="js/dashboard.js"></script>
<script src="js/legacy-settings.js"></script>
<script src="js/app.js"></script>
